{{- define "flipkiln.apiWorkload" -}}
{{- $root := .root -}}
{{- $component := .component -}}
{{- $app := .app -}}
{{- $image := include "flipkiln.image" (dict "image" $app.image "fallback" $root.Values.api.image) -}}
{{- $apiEnv := dict "root" $root "mode" .mode -}}
{{- $name := printf "%s-%s" $root.Release.Name $component | trunc 63 | trimSuffix "-" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ $name }}
    labels:
        {{- include "flipkiln.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
spec:
    replicas: {{ $app.replicas }}
    selector:
        matchLabels:
            {{- include "flipkiln.labels" $root | nindent 12 }}
            app.kubernetes.io/component: {{ $component }}
    template:
        metadata:
            labels:
                {{- include "flipkiln.labels" $root | nindent 16 }}
                app.kubernetes.io/component: {{ $component }}
        spec:
            automountServiceAccountToken: false
            terminationGracePeriodSeconds: 30
            securityContext:
                {{- include "flipkiln.podSecurity" . | nindent 16 }}
            {{- with $root.Values.imagePullSecrets }}
            imagePullSecrets: {{- toYaml . | nindent 16 }}
            {{- end }}
            containers:
                -   name: {{ $component }}
                    image: {{ $image | quote }}
                    imagePullPolicy: {{ default $root.Values.api.image.pullPolicy $app.image.pullPolicy }}
                    ports:
                        -   name: http
                            containerPort: 8080
                    env:
                        {{- include "flipkiln.apiEnv" $apiEnv | nindent 24 }}
                    securityContext:
                        {{- include "flipkiln.containerSecurity" . | nindent 24 }}
                    resources: {{- toYaml $app.resources | nindent 24 }}
                    startupProbe:
                        httpGet: {path: /health/live, port: http}
                        periodSeconds: 2
                        failureThreshold: 30
                    livenessProbe:
                        httpGet: {path: /health/live, port: http}
                        periodSeconds: 10
                    readinessProbe:
                        httpGet: {path: /health/ready, port: http}
                        periodSeconds: 2
                        timeoutSeconds: 2
                        failureThreshold: 2
                    volumeMounts:
                        -   name: tmp
                            mountPath: /tmp
            volumes:
                -   name: tmp
                    emptyDir:
                        sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
    name: {{ $name }}
    labels:
        {{- include "flipkiln.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
spec:
    type: ClusterIP
    selector:
        {{- include "flipkiln.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    ports:
        -   name: http
            port: 8080
            targetPort: http
{{- end }}
{{- $keys := required "storage.existingSecret is required" .Values.storage.existingSecret -}}
{{ include "flipkiln.apiWorkload" (dict "root" . "component" "api" "app" .Values.api "mode" "control") }}
---
{{ include "flipkiln.apiWorkload" (dict
    "root" . "component" "runtime" "app" .Values.runtime "mode" "runtime") }}
---
{{ include "flipkiln.apiWorkload" (dict
    "root" . "component" "storage-api" "app" .Values.storage "mode" "storage") }}
