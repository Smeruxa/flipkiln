{{- $secret := default .Values.secrets.existingSecret .Values.secrets.migrationSecret -}}
{{- $apiEnv := dict "root" . "secret" $secret "migration" true -}}
apiVersion: batch/v1
kind: Job
metadata:
    name: {{ printf "%s-migrate-%d" (.Release.Name | trunc 47 | trimSuffix "-") .Release.Revision }}
    labels:
        {{- include "flipkiln.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    annotations:
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
    backoffLimit: 0
    activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
    ttlSecondsAfterFinished: 86400
    template:
        metadata:
            labels:
                {{- include "flipkiln.labels" . | nindent 16 }}
                app.kubernetes.io/component: migrate
        spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            securityContext:
                {{- include "flipkiln.podSecurity" . | nindent 16 }}
            {{- with .Values.imagePullSecrets }}
            imagePullSecrets: {{- toYaml . | nindent 16 }}
            {{- end }}
            containers:
                -   name: migrate
                    image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
                    imagePullPolicy: {{ .Values.api.image.pullPolicy }}
                    command: [/usr/local/bin/flipkiln-api, migrate]
                    env:
                        {{- include "flipkiln.apiEnv" $apiEnv | nindent 24 }}
                    securityContext:
                        {{- include "flipkiln.containerSecurity" . | nindent 24 }}
                    resources: {{- toYaml .Values.api.resources | nindent 24 }}
                    volumeMounts:
                        -   name: tmp
                            mountPath: /tmp
            volumes:
                -   name: tmp
                    emptyDir:
                        sizeLimit: 32Mi
