apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: flipkiln-kind-postgres-bootstrap
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: flipkiln-postgres
            app.kubernetes.io/instance: flipkiln-db
    policyTypes: [Ingress]
    ingress:
        - from:
              - podSelector:
                    matchLabels:
                        app.kubernetes.io/name: flipkiln
                        app.kubernetes.io/instance: flipkiln
                    matchExpressions:
                        - key: app.kubernetes.io/component
                          operator: In
                          values: [api, runtime, migrate]
          ports:
              - protocol: TCP
                port: 5432
