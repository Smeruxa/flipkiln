apiVersion: v1
kind: Service
metadata:
    name: flipkiln-postgres
spec:
    selector:
        app.kubernetes.io/name: flipkiln-postgres
        app.kubernetes.io/instance: flipkiln-db
    ports:
        - name: postgres
          port: 5432
          targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
    name: flipkiln-postgres-pods
spec:
    clusterIP: None
    selector:
        app.kubernetes.io/name: flipkiln-postgres
        app.kubernetes.io/instance: flipkiln-db
    ports:
        - name: postgres
          port: 5432
          targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: flipkiln-postgres
spec:
    replicas: 1
    serviceName: flipkiln-postgres-pods
    selector:
        matchLabels:
            app.kubernetes.io/name: flipkiln-postgres
            app.kubernetes.io/instance: flipkiln-db
    template:
        metadata:
            labels:
                app.kubernetes.io/name: flipkiln-postgres
                app.kubernetes.io/instance: flipkiln-db
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsNonRoot: true
                runAsUser: 70
                runAsGroup: 70
                fsGroup: 70
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: postgres
                  image: postgres@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
                  ports:
                      - name: postgres
                        containerPort: 5432
                  env:
                      - name: PGDATA
                        value: /var/lib/postgresql/data/pgdata
                      - name: POSTGRES_DB
                        value: flipkiln
                      - name: POSTGRES_USER
                        value: flipkiln
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: flipkiln-kind-postgres
                                key: POSTGRES_PASSWORD
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: [ALL]
                  startupProbe:
                      exec:
                          command: [pg_isready, -h, 127.0.0.1, -U, flipkiln, -d, flipkiln]
                      periodSeconds: 2
                      failureThreshold: 30
                  readinessProbe:
                      exec:
                          command: [pg_isready, -h, 127.0.0.1, -U, flipkiln, -d, flipkiln]
                      periodSeconds: 2
                  livenessProbe:
                      exec:
                          command: [pg_isready, -h, 127.0.0.1, -U, flipkiln, -d, flipkiln]
                      periodSeconds: 10
                  resources:
                      requests:
                          cpu: 100m
                          memory: 128Mi
                      limits:
                          cpu: '1'
                          memory: 384Mi
                  volumeMounts:
                      - name: data
                        mountPath: /var/lib/postgresql/data
                      - name: socket
                        mountPath: /var/run/postgresql
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: socket
                  emptyDir:
                      sizeLimit: 16Mi
                - name: tmp
                  emptyDir:
                      sizeLimit: 32Mi
    volumeClaimTemplates:
        - metadata:
              name: data
          spec:
              accessModes: [ReadWriteOnce]
              storageClassName: standard
              resources:
                  requests:
                      storage: 1Gi
